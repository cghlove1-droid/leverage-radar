name: Daily market data update
on:
  schedule:
    - cron: '15 23 * * 1-5'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: market-data
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -r requirements.txt
      - name: Tests
        run: |
          python -m unittest discover -s tests -v
          node --test tests/core.test.mjs
      - name: Fetch authorized data
        id: fetch
        continue-on-error: true
        env:
          DATA_PROVIDER: ${{ vars.DATA_PROVIDER }}
          MASSIVE_API_KEY: ${{ secrets.MASSIVE_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          MARKET_DATA_URL: ${{ secrets.MARKET_DATA_URL }}
          MARKET_DATA_TOKEN: ${{ secrets.MARKET_DATA_TOKEN }}
        run: python scripts/update.py
      - name: Verify public build
        id: build
        continue-on-error: true
        run: python scripts/build.py
      - name: Commit data and safe error status
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/market.json data/status.json
          if ! git diff --cached --quiet; then
            git commit -m "Update market data and collection status"
            git push
          fi
      - name: Report collection failure
        if: steps.fetch.outcome == 'failure' || steps.build.outcome == 'failure'
        run: |
          echo "Collection failed. Last-good market data retained; inspect data/status.json."
          exit 1
